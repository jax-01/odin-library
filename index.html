<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&icon_names=book_2" />
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <title>Odin Library</title>
</head>
<body>
  <nav>
    <div class="nav-elements-container">
      <div class="left-nav">
        <a href="#">
          <img src="./img/odin-lined.png" alt="odin logo">
          <span>The Odin Library</span>
        </a>
      </div>
      <div class="right-nav">
        <span class="material-symbols-outlined">
          book_2
        </span>
        <p>A simple library</p>
      </div>
    </div>
  </nav>
  <div class="button-container">
    <button id="new-book-button">New Book</button>
  </div>
  <dialog id="new-book-modal">
    <form>
      <div class="form-row">
        <label for="book-title">Book title</label>
        <input type="text" name="book-title-input" id="book-title-input" required>
      </div>
      <div class="form-row">
        <label for="book-author">Book author</label>
        <input type="text" name="book-author-input" id="book-author-input" required>
      </div>
      <div class="form-row">
        <label for="book-pages">Number of pages</label>
        <input type="number" name="book-pages-input" id="book-pages-input" min="1" required>
      </div>
      <fieldset>
        <label for="read-status">Read</label>
        <input type="checkbox" name="read-status-input" id="read-status-input" required>
      </fieldset>
      <div class="form-row button-container">
        <button type="submit" id="add-book" value="default">Add book</button>
        <button type="submit" id="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <div class="books-container">

  </div>
</body>
</html>
